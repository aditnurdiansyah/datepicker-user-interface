<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datepicker UI</title>
    <!-- SEO (Search Engine Optimization) -->
    <meta name="description" content="Personal portfolio of Adit Nurdiansyah, a Full Stack Developer.">
    <meta name="keywords" content="Web Development, Full Stack Developer, HTML, CSS, Personal Portfolio">
    <meta name="author" content="Adit Nurdiansyah">

    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon">

    <!-- OG (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aditnurdiansyah.my.id">
    <meta property="og:title" content="Adit Nurdiansyah - Full Stack Developer">
    <meta property="og:description" content="Single Page CV of Adit Nurdiansyah, a Full Stack Developer.">
    <meta property="og:image" content="https://aditnurdiansyah.my.id/assets/open-graph/aditnurdiansyah-full-stack-developer-og.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="datepicker">
      <section class="datepicker-input">
        <input type="text" placeholder="dd/mm/yyyy">
        <button class="datepicker-icon">
          <img src="/assets/icons/calendar.svg" alt="Calendar Icon">
        </button>
      </section>

      <section class="calendar">
        <div class="calendar-header">
          <button class="prev">
            <img src="/assets/icons/chevron-left.svg" alt="Left Arrow">
          </button>
          <span class="month-year">September 2026</span>
          <button class="next">
            <img src="/assets/icons/chevron-right.svg" alt="Right Arrow">
          </button>
        </div>
        <div class="calendar-body">
          <div class="day-names">
            <span>Su</span>
            <span>Mo</span>
            <span>Tu</span>
            <span>We</span>
            <span>Th</span>
            <span>Fr</span>
            <span>Sa</span>
          </div>
          <div class="days">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
            <span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span>
            <span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span>
            <span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span>
            <span>29</span><span>30</span><span>31</span><span>1</span><span>2</span><span>3</span><span>4</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
